name: Deploy Isolated Finance Preview Worker

# A push to this branch reruns the isolated preview deployment after environment secrets are configured.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/admin-finance-password-recovery
    paths:
      - "worker.ts"
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.preview.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/finance-preview-worker-deploy.yml"

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: finance-preview
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        with:
          version: 10
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website assets
        run: pnpm build

      - name: Apply migrations to Preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing finance-preview environment secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing finance-preview environment variable CLOUDFLARE_ACCOUNT_ID" && exit 1)
          pnpm exec wrangler d1 migrations apply nhym2026-finance-preview --remote --config wrangler.preview.jsonc

      - name: Deploy isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.PREVIEW_ADMIN_TOKEN }}
          NHYM_EMAIL_SECRET: ${{ secrets.PREVIEW_NHYM_EMAIL_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing finance-preview environment secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing finance-preview environment variable CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ADMIN_TOKEN" || (echo "Missing finance-preview environment secret PREVIEW_ADMIN_TOKEN" && exit 1)
          test -n "$NHYM_EMAIL_SECRET" || (echo "Missing finance-preview environment secret PREVIEW_NHYM_EMAIL_SECRET" && exit 1)
          printf '%s' "$ADMIN_TOKEN" | pnpm exec wrangler secret put ADMIN_TOKEN --config wrangler.preview.jsonc
          printf '%s' "$NHYM_EMAIL_SECRET" | pnpm exec wrangler secret put NHYM_EMAIL_SECRET --config wrangler.preview.jsonc
          pnpm exec wrangler deploy --config wrangler.preview.jsonc

      - name: Verify Worker and Preview isolation
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://nhymindia-finance-preview.2026jsr.workers.dev';
          const checks = [
            { path: '/api/finance/setup-status', expected: 200 },
            { path: '/api/admin/finance-users', expected: 401 },
            { path: '/api/finance/change-password', method: 'POST', body: { currentPassword: 'not-real', newPassword: 'also-not-real' }, expected: 401 }
          ];
          for (const check of checks) {
            const response = await fetch(base + check.path, {
              method: check.method || 'GET',
              headers: check.body ? { 'content-type': 'application/json' } : {},
              body: check.body ? JSON.stringify(check.body) : undefined
            });
            if (response.status !== check.expected) {
              console.error('FAIL', check.path, 'expected', check.expected, 'got', response.status);
              process.exitCode = 1;
            } else console.log('PASS', check.path, response.status);
          }
          if (process.exitCode) process.exit(1);
          NODE
