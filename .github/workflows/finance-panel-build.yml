name: Finance Panel Build Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/nhym-finance-panel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript and production build
        run: pnpm run build

      - name: Bundle checks
        run: pnpm run check:bundle
