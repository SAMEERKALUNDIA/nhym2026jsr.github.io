name: Production Registration API Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-api:
    name: Verify production registration API routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production registration status returns JSON
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://nhymindia.2026jsr.workers.dev';
          const response = await fetch(base + '/api/registration-status', {
            headers: { accept: 'application/json' },
            cache: 'no-store',
          });
          const contentType = response.headers.get('content-type') || '';
          const body = await response.text();

          if (response.status !== 200) {
            throw new Error('Registration status expected HTTP 200; got ' + response.status + ': ' + body.slice(0, 200));
          }
          if (!contentType.includes('application/json')) {
            throw new Error('Registration status expected JSON; got ' + contentType + ': ' + body.slice(0, 200));
          }

          let data;
          try { data = JSON.parse(body); }
          catch { throw new Error('Registration status returned invalid JSON: ' + body.slice(0, 200)); }

          if (typeof data.open !== 'boolean') {
            throw new Error('Registration status JSON must contain boolean "open".');
          }
          console.log('PASS production registration status API; open =', data.open);
          NODE

      - name: Check invalid registration payload is rejected as JSON without creating a registration
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://nhymindia.2026jsr.workers.dev';
          const response = await fetch(base + '/api/registrations', {
            method: 'POST',
            headers: {
              accept: 'application/json',
              'content-type': 'application/json',
            },
            body: JSON.stringify({}),
            cache: 'no-store',
          });
          const contentType = response.headers.get('content-type') || '';
          const body = await response.text();

          // The API returns 403 when registration is closed, otherwise this
          // deliberately incomplete payload must be rejected with HTTP 400.
          if (![400, 403].includes(response.status)) {
            throw new Error('Invalid registration payload should be rejected with HTTP 400 or 403; got ' + response.status + ': ' + body.slice(0, 200));
          }
          if (!contentType.includes('application/json')) {
            throw new Error('Registration endpoint expected JSON; got ' + contentType + ': ' + body.slice(0, 200));
          }

          let data;
          try { data = JSON.parse(body); }
          catch { throw new Error('Registration endpoint returned invalid JSON: ' + body.slice(0, 200)); }

          if (typeof data.error !== 'string' || !data.error.trim()) {
            throw new Error('Rejected registration response must contain a JSON error message.');
          }
          console.log('PASS production registration endpoint rejects empty payload as JSON; HTTP', response.status);
          NODE
