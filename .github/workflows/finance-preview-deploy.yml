name: Finance Preview Deployment and Smoke Tests

on:
  push:
    branches:
      - feature/admin-finance-password-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend assets
        run: pnpm run build
      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not configured; production was not touched."
            exit 1
          fi
          pnpm dlx wrangler@4 deploy --config wrangler.preview.jsonc
      - name: Smoke-test preview routes
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://nhymindia-finance-preview.2026jsr.workers.dev';
          const checks = [
            { path: '/', expected: 200, name: 'preview homepage' },
            { path: '/login', expected: 200, name: 'shared login page' },
            { path: '/api/admin/finance-users', expected: 401, name: 'admin-only Finance account list rejects anonymous requests' },
            { path: '/api/finance/login', method: 'POST', body: { loginId: 'missing-preview-user', password: 'not-a-real-password' }, expected: 401, name: 'Finance login rejects unknown account' }
          ];
          for (const check of checks) {
            const response = await fetch(base + check.path, {
              method: check.method || 'GET',
              headers: check.body ? { 'content-type': 'application/json' } : {},
              body: check.body ? JSON.stringify(check.body) : undefined
            });
            const text = await response.text();
            if (response.status !== check.expected) {
              console.error(`FAIL ${check.name}: expected ${check.expected}, got ${response.status}; body=${text.slice(0,200)}`);
              process.exitCode = 1;
            } else {
              console.log(`PASS ${check.name} (${response.status})`);
            }
          }
          if (process.exitCode) process.exit(1);
          NODE
