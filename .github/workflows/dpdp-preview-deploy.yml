name: DPDP Isolated Preview Deployment and API Tests

on:
  push:
    branches:
      - dpdp-request-verification-workflow
    paths:
      - "worker.ts"
      - "src/**"
      - "public/**"
      - "wrangler.dpdp-preview.jsonc"
      - ".github/workflows/dpdp-preview-deploy.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpdp-isolated-preview-worker
  cancel-in-progress: false

jobs:
  deploy-and-test:
    runs-on: ubuntu-24.04
    environment: finance-preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Preview isolation and Worker syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import ts from 'typescript'
          const production = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'))
          const preview = JSON.parse(readFileSync('wrangler.dpdp-preview.jsonc', 'utf8'))
          const fail = message => { console.error('FAIL ' + message); process.exit(1) }
          if (preview.name !== 'nhymindia-dpdp-preview') fail('Unexpected DPDP Preview Worker name.')
          if (preview.name === production.name) fail('Preview Worker must not share production Worker name.')
          if (preview.d1_databases?.[0]?.database_id === production.d1_databases?.[0]?.database_id) fail('Preview must not bind production D1.')
          if (preview.r2_buckets?.[0]?.bucket_name === production.r2_buckets?.[0]?.bucket_name) fail('Preview must not bind production R2.')
          if (preview.vars?.FINANCE_PREVIEW_MODE !== 'true') fail('Preview-only mode must be enabled.')
          const result = ts.transpileModule(readFileSync('worker.ts', 'utf8'), {
            reportDiagnostics: true,
            compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext }
          })
          const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error)
          if (errors.length) {
            for (const diagnostic of errors) console.error(ts.flattenDiagnosticMessageText(diagnostic.messageText, '\\n'))
            process.exit(1)
          }
          console.log('PASS isolated Worker name, non-production D1/R2 bindings, Preview mode and Worker syntax.')
          NODE

      - name: Build website assets
        run: pnpm build

      - name: Deploy isolated DPDP Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.PREVIEW_ADMIN_TOKEN }}
          NHYM_EMAIL_SECRET: ${{ secrets.PREVIEW_NHYM_EMAIL_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing finance-preview environment secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing finance-preview environment variable CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ADMIN_TOKEN" || (echo "Missing finance-preview environment secret PREVIEW_ADMIN_TOKEN" && exit 1)
          test -n "$NHYM_EMAIL_SECRET" || (echo "Missing finance-preview environment secret PREVIEW_NHYM_EMAIL_SECRET" && exit 1)
          printf '%s' "$ADMIN_TOKEN" | pnpm dlx wrangler@4 secret put ADMIN_TOKEN --config wrangler.dpdp-preview.jsonc
          printf '%s' "$NHYM_EMAIL_SECRET" | pnpm dlx wrangler@4 secret put NHYM_EMAIL_SECRET --config wrangler.dpdp-preview.jsonc
          pnpm dlx wrangler@4 deploy --config wrangler.dpdp-preview.jsonc

      - name: Test privacy request and sensitive-data audit access controls
        env:
          PREVIEW_ADMIN_TOKEN: ${{ secrets.PREVIEW_ADMIN_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://nhymindia-dpdp-preview.2026jsr.workers.dev'
          const adminToken = process.env.PREVIEW_ADMIN_TOKEN
          if (!adminToken) throw new Error('Preview Admin test token is not configured.')
          const routes = [
            ['/api/admin/privacy-requests', 'privacy request queue'],
            ['/api/admin/privacy-access-audit', 'sensitive-data access audit']
          ]
          async function fetchRoute(path, token) {
            const response = await fetch(base + path, {
              headers: token ? { authorization: 'Bearer ' + token } : {},
              cache: 'no-store'
            })
            const contentType = response.headers.get('content-type') || ''
            const text = await response.text()
            let data = null
            try { data = JSON.parse(text) } catch {}
            return { status: response.status, contentType, data, text: text.slice(0, 120) }
          }
          const deadline = Date.now() + 120000
          let ready = false
          while (Date.now() < deadline) {
            try {
              const response = await fetch(base + '/api/admin/privacy-requests', { cache: 'no-store' })
              if (response.status === 401) { ready = true; break }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000))
          }
          if (!ready) throw new Error('DPDP Preview Worker did not become ready with expected unauthenticated denial.')
          for (const [path, label] of routes) {
            const denied = await fetchRoute(path, null)
            if (denied.status !== 401 || !denied.contentType.toLowerCase().includes('application/json') || denied.data?.error !== 'Unauthorized') {
              throw new Error('FAIL ' + label + ' must deny unauthenticated access with JSON 401; got HTTP ' + denied.status + ', content-type=' + denied.contentType + ', body=' + denied.text)
            }
            console.log('PASS ' + label + ' denies unauthenticated requests (JSON 401)')
            const allowed = await fetchRoute(path, adminToken)
            if (allowed.status !== 200 || !allowed.contentType.toLowerCase().includes('application/json') || !allowed.data || typeof allowed.data !== 'object') {
              throw new Error('FAIL authorized Admin could not read ' + label + ' JSON; HTTP ' + allowed.status + ', content-type=' + allowed.contentType + ', body=' + allowed.text)
            }
            // Do not print returned request records or audit contents: they may contain sensitive operational data.
            console.log('PASS authorized Admin receives JSON for ' + label + ' (200; response content withheld)')
          }
          console.log('PASS DPDP Preview API access-control smoke tests.')
          NODE

      - name: End-to-end privacy request lifecycle test
        env:
          PREVIEW_ADMIN_TOKEN: ${{ secrets.PREVIEW_ADMIN_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://nhymindia-dpdp-preview.2026jsr.workers.dev'
          const token = process.env.PREVIEW_ADMIN_TOKEN
          if (!token) throw new Error('Preview Admin test token is not configured.')
          const adminHeaders = { authorization: 'Bearer ' + token, 'content-type': 'application/json' }
          async function call(path, options = {}) {
            const response = await fetch(base + path, { ...options, cache: 'no-store' })
            const text = await response.text()
            let data
            try { data = JSON.parse(text) } catch { throw new Error(path + ' returned non-JSON HTTP ' + response.status) }
            return { status: response.status, data }
          }
          const created = await call('/api/privacy-requests', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              requestType: 'ACCESS',
              email: 'dpdp-lifecycle-test@example.invalid',
              registrationId: '',
              details: 'Automated isolated-preview lifecycle test; no real person data.',
              acknowledgement: true
            })
          })
          if (created.status !== 201 || !created.data?.requestId) throw new Error('Could not create isolated test request: HTTP ' + created.status)
          const id = created.data.requestId
          const patch = (body) => call('/api/admin/privacy-requests/' + encodeURIComponent(id), {
            method: 'PATCH', headers: adminHeaders, body: JSON.stringify(body)
          })
          let result = await patch({ status: 'IN_REVIEW', resolutionNote: '', verificationStatus: 'UNVERIFIED', verificationMethod: '' })
          if (result.status !== 200) throw new Error('RECEIVED -> IN_REVIEW failed: HTTP ' + result.status)
          result = await patch({ status: 'COMPLETED', resolutionNote: 'Test completion blocked before verification.', verificationStatus: 'UNVERIFIED', verificationMethod: '' })
          if (result.status !== 409) throw new Error('Expected completion to be blocked before identity verification; got HTTP ' + result.status)
          console.log('PASS completion is blocked before identity verification.')
          result = await patch({ status: 'NEEDS_VERIFICATION', resolutionNote: '', verificationStatus: 'PENDING', verificationMethod: '' })
          if (result.status !== 200) throw new Error('IN_REVIEW -> NEEDS_VERIFICATION failed: HTTP ' + result.status)
          result = await patch({ status: 'NEEDS_VERIFICATION', resolutionNote: '', verificationStatus: 'VERIFIED', verificationMethod: 'REGISTRATION_DETAILS' })
          if (result.status !== 200 || result.data?.verificationStatus !== 'VERIFIED') throw new Error('Identity verification step failed: HTTP ' + result.status)
          result = await patch({ status: 'COMPLETED', resolutionNote: 'Automated preview test completed; no participant record changed.', verificationStatus: 'VERIFIED', verificationMethod: 'REGISTRATION_DETAILS' })
          if (result.status !== 200 || result.data?.status !== 'COMPLETED') throw new Error('Verified request could not be completed: HTTP ' + result.status)
          const audit = await call('/api/admin/privacy-requests/' + encodeURIComponent(id) + '/audit', { headers: { authorization: 'Bearer ' + token } })
          if (audit.status !== 200 || !Array.isArray(audit.data?.audit)) throw new Error('Request audit history unavailable: HTTP ' + audit.status)
          const actions = audit.data.audit.map(entry => entry.action)
          if (!actions.includes('IDENTITY_VERIFICATION_CHANGED') || !actions.includes('STATUS_CHANGED')) throw new Error('Expected status and identity-verification audit events were not recorded.')
          console.log('PASS full lifecycle RECEIVED -> IN_REVIEW -> NEEDS_VERIFICATION -> VERIFIED -> COMPLETED.')
          console.log('PASS request audit history records status and identity-verification changes; test data remains isolated in Preview.')
          NODE

